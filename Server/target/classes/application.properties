# Server Configuration
server.port=8080

# Database Configuration
# Credentials must be provided via environment variables — never hardcode real values here.
# For local dev, export these in your shell, use an IDE run config, or create a gitignored
# application-local.properties (see below). Uses PostgreSQL by default; uncomment H2 block
# below when running without Postgres locally.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# spring.datasource.url=jdbc:h2:file:./data/mentoringdb;AUTO_SERVER=TRUE
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# SQL Initialization (disabled since we use JPA ddl-auto=update)
spring.sql.init.mode=never

# JWT Configuration
# Secret must be provided via environment variable — never hardcode in source control.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
logging.level.org.springframework.security=DEBUG
logging.level.com.mentoringplatform=DEBUG 

# Push Notification Configuration
push.dispatch.enabled=${PUSH_DISPATCH_ENABLED:true}
# VAPID keys should be provided via environment variables for security.
# For local development, set these in your shell or use a secrets management tool.
# Example: export PUSH_VAPID_PUBLIC_KEY="your-public-key"
# The private key should NEVER be committed to source control.
push.vapid.public-key=${PUSH_VAPID_PUBLIC_KEY:}
push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY:}
push.vapid.subject=${PUSH_VAPID_SUBJECT:mailto:support@mentoringplatform.com}